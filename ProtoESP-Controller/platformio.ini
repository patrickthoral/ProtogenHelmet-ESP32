[env:esp32-s3]
board = esp32-s3-devkitc-1
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = 4MB_17-17-05.csv
extra_scripts = genCRC-auto.py
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = 
    -DARDUINO_USB_MODE=1
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	; FastLED holds the flash lock during each LED transmission, so a LittleFS read (web UI) waits instead of disabling the flash cache mid-show,
	; which crashed when FastLED had to start a controller from its RMT interrupt. Must be a build flag: FastLED's driver .cpp never sees main.cpp's #defines
	-DFASTLED_ESP32_FLASH_LOCK=1
	; Only 1 RMT channel (2 mem blocks each, so channel 0 only): visor and ears/blush are sent one after another instead of simultaneously, so the edges on
	; one data line can't couple into the other (crosstalk/ground bounce glitched the ears whenever both lines were connected). The 2nd controller is
	; started from the RMT interrupt, which is safe now that FASTLED_ESP32_FLASH_LOCK keeps the flash cache enabled. Remove to send both in parallel again.
	-DFASTLED_RMT_MAX_CHANNELS=2
lib_deps = 
	bblanchon/StreamUtils@1.9.0
	fastled/FastLED@3.7.8
;	fastled/FastLED@^3.9.20
;	https://github.com/FastLED/FastLED.git
	bblanchon/ArduinoJson@7.4.3
	sparkfun/SparkFun LSM6DS3 Breakout@1.0.3
	olikraus/U8g2@2.36.5
	h2zero/NimBLE-Arduino@2.5.0
	adafruit/Adafruit BusIO@1.17.4
	https://github.com/FrankBoesing/FastCRC.git
	majicdesigns/MD_MAX72XX@3.5.1
	arduinogetstarted/ezButton@1.0.6
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.10.3
	ayushsharma82/ElegantOTA@3.1.7
	adafruit/Adafruit VL53L1X@3.1.2

; Temporary replacement board (ESP32-S3R8): same as above, but its embedded 8MB PSRAM is octal instead of quad
[env:esp32-s3-octal]
extends = env:esp32-s3
board_build.arduino.memory_type = qio_opi
; GPIO7 doesn't work on this board, so the visor data line goes to GPIO44 (U0RXD, free since Serial runs over native USB)
build_flags =
	${env:esp32-s3.build_flags}
	-DDATA_PIN_VISOR=44